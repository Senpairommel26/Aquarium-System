<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium Monitoring</title>
    <style>
        /* --- General Body Styles (Modernized) --- */
        body {
            background-color: #f7f7f7; /* Very light gray background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Cleaner, modern font */
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2c3e50; /* Dark text color */
        }

        .container {
            text-align: center;
        }

        /* --- Heading Style --- */
        h1 {
            font-size: 4.5em; /* Slightly larger */
            font-weight: 300; /* Lighter font weight for modern feel */
            margin-bottom: 60px;
            color: #3498db; /* Blue heading color */
        }

        /* --- Button Box Style --- */
        .button-box {
            display: inline-block;
            padding: 15px 40px; 
            border: 2px solid #3498db; /* Blue border */
            background-color: #ffffff; /* White background */
            border-radius: 8px; /* More rounded corners */
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }

        .button-box:hover {
            background-color: #3498db; /* Solid blue background on hover */
            border-color: #2980b9; 
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px); /* Slight lift effect */
        }

        /* --- Button Text Style --- */
        .button-text {
            font-family: inherit;
            font-size: 1.6em;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        /* Change text color to white when the button is hovered */
        .button-box:hover .button-text {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aquarium Monitoring</h1>
        
        <a href="dashboard.php" class="button-box">
            <span class="button-text">GET STARTED</span>
        </a>
    </div>
</body>
</html>
